<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Amazon</title>
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="main-logo">
          <div class="logo"></div>
        </div>

        <div class="nav-location">
          <p class="adress1">Delivery to country</p>

          <div class="location-icon">
            <i class="fa-solid fa-location-dot"></i>
            <p class="adress2">Update location</p>
          </div>
        </div>




<div class="search-barext">
         <div class="search-bar">

                 
                        <select  class="category">
                          <option>All</option>
                          <option>Toys</option>
                          <option>Electronics</option>
                          <option>Utensils</option>
                          <option>Books</option>
                        </select>
                  

                  
                    <input placeholder="SEARCH" class="search">
                  

                  <div class="lens">
                    <i class="fa-solid fa-magnifying-glass"></i>
                  </div>
         </div>
</div>


<div class="country">
  <i class="fa-solid fa-flag-usa"></i>USA
</div>


<div class="signin">
  <span>Hello Sign in</span></br>
  Accounts
</div>


<div class="orders">
  <p class="ord">Orders</p>
  <p class="reo">and reorders</p> 
</div>

<div class="cart">

  <div class="cart-icon"><i class="fa-solid fa-cart-shopping"></i></div>
  Cart
  
</div>



      </div>
    </header>
  </body>
</html>
